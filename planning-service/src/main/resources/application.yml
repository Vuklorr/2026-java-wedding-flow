server:
  port: 8083

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_PLANNING_PORT}/${POSTGRES_PLANNING_DB}
    username: ${POSTGRES_PLANNING_USER}
    password: ${POSTGRES_PLANNING_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate


clients:
  wedding:
    base-url: http://localhost:8082