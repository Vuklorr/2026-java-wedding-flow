server:
  port: 8085

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_NOTIFICATION_PORT}/${POSTGRES_NOTIFICATION_DB}
    username: ${POSTGRES_NOTIFICATION_USER}
    password: ${POSTGRES_NOTIFICATION_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

