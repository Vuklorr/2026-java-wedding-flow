services:
  db_wedding:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:56000:5432"
    volumes:
      - wedding_data:/var/lib/postgresql/data

  db_planning:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_PLANNING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PLANNING_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PLANNING_DB}
    ports:
      - "127.0.0.1:56001:5432"
    volumes:
      - planning_data:/var/lib/postgresql/data

  db_budget:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_BUDGET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BUDGET_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BUDGET_DB}
    ports:
      - "127.0.0.1:56002:5432"
    volumes:
      - budget_data:/var/lib/postgresql/data

  db_notification:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_NOTIFICATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NOTIFICATION_DB}
    ports:
      - "127.0.0.1:56003:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data

  broker:
    image: apache/kafka:4.1.1
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://broker:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
volumes:
  wedding_data:
  planning_data:
  budget_data:
  notification_data:
  kafka_data: