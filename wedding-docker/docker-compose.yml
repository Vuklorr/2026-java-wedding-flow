services:
  db_wedding:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:56000:5432"
    volumes:
      - wedding_data:/var/lib/postgresql/data

  db_planning:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_PLANNING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PLANNING_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PLANNING_DB}
    ports:
      - "127.0.0.1:56001:5432"
    volumes:
      - planning_data:/var/lib/postgresql/data
volumes:
  wedding_data:
  planning_data: